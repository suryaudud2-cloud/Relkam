name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q rekam.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: cd Rekam1080 && gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Rekam1080-apk
          path: Rekam1080/app/build/outputs/apk/debug/*.apk
